<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBTI Brawl · VFX Playground</title></head><body><div id="art-app"><header class="art-header"><div><span class="art-logo">✳</span><b>MBTI BRAWL <span>/ VFX LAB</span></b><small>美术探索 · V1</small></div><a href="/">返回游戏 ↗</a></header><main class="art-layout"><section class="art-preview"><div class="preview-top"><span class="live-dot"></span><span>实时预览</span><b id="phase" role="status">待机</b><span class="renderer" id="renderer"></span></div><div id="playground" aria-label="独立技能特效预览"></div><div class="preview-caption"><span><i class="swatch mud"></i>泥潭样例</span><span><i class="swatch toxic"></i>毒区样例</span><span>仅视觉 · 无战斗判定</span></div><div class="beat-strip"><span data-beat="蓄力">01　蓄力 <small>0.9s</small></span><span data-beat="爆发">02　爆发 <small>核心 / 冲击波</small></span><span data-beat="消散">03　消散 <small>阻尼 / 淡出</small></span></div><div class="art-actions"><button id="replay" class="primary">✦ 释放技能 <kbd>SPACE</kbd></button><button id="stress">8 次同时爆发</button><button id="stress16">16 次压力测试</button><button id="pause">暂停</button><button id="clear">清空</button></div><div class="art-metrics" id="metrics" aria-live="off">等待采样…</div><p class="art-note" id="motion-note">浅色纯色地面 · 无发光 · 与正式场景隔离</p></section><aside class="art-panel"><div class="panel-title"><div><small>LOOK DEVELOPMENT</small><h1>特效参数</h1></div><button id="reset" title="恢复默认参数">↺</button></div><div class="preset-row"><button data-color="#a974ff" style="--preset:#a974ff">紫电</button><button data-color="#59e4d0" style="--preset:#59e4d0">薄荷</button><button data-color="#ffc574" style="--preset:#ffc574">日光</button></div><div class="quality-row"><label for="quality">渲染质量</label><select id="quality"><option value="high">高 · 512 粒子</option><option value="medium">中 · 256 粒子</option><option value="low">低 · 96 粒子</option></select></div><div id="controls"></div><label class="auto-row"><input type="checkbox" id="auto" checked> 自动循环演示</label><p class="panel-note">地面参数即时生效。特效参数实时更新；粒子数量与生命周期在下次发射时采用新值。</p></aside></main></div><script type="module" src="/src/client/art/VfxPlayground.ts"></script></body></html>
